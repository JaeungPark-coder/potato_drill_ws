[develop]
script-dir=$base/lib/potato_scan
[install]
install-scripts=$base/lib/potato_scan

[tool:pytest]
testpaths = test
markers =
    slow: takes seconds, not milliseconds (the coverage sweeps). Skip with -m "not slow"
addopts =
    -p no:launch_testing -p no:launch_ros -p no:launch_pytest
    -p no:ament_lint -p no:ament_flake8 -p no:ament_pep257
    -p no:ament_copyright -p no:ament_xmllint
