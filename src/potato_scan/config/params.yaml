# Step 1 (run first): ros2 run potato_scan handeye_calibration
# Freedrive the arm, capture 10-15+ views of a fixed checkerboard, then
# copy the printed tcp_cam_translation / tcp_cam_quat_xyzw below into the
# scan_controller block -- everything downstream depends on this.
handeye_calibration:
  ros__parameters:
    robot_ip: "192.168.1.100"
    image_topic: "/camera/color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    chessboard_cols: 9   # inner corners, width
    chessboard_rows: 6   # inner corners, height
    square_size_m: 0.025
    output_path: "handeye_result.yaml"

scan_controller:
  ros__parameters:
    robot_ip: "192.168.1.100"
    # 'rtde' = real UR5e / URSim over RTDE (default, unchanged real-hardware
    # behavior). 'isaac_sim' = talk to isaac/isaac_scene.py over ROS2 topics
    # + TF instead -- run that script separately first, then launch with
    # robot_backend:=isaac_sim.
    robot_backend: "rtde"
    tcp_frame: "tool0"   # only used by isaac_sim backend (TF lookup)
    base_frame: "base_link"
    # Fixed potato location in the robot base frame (meters). Measure this
    # once for your fixture, or replace with a coarse detection later.
    potato_center: [0.50, 0.00, 0.15]
    # No per-potato size measurement needed here: these are generic bounds
    # loose enough to admit any real potato this fixture could hold (and
    # reject the table/fixture/gripper, which sit well outside the band).
    # The actual radius of whichever potato is currently mounted is
    # estimated live from the scan itself (median radius of plausible
    # points -- see surface_coverage.SurfaceCoverageGrid), logged each
    # step as estimated_potato_radius. radius_band is how far a point may
    # sit from that live estimate and still count as "on the surface" --
    # generous enough for a potato's natural lumpiness/elongation.
    min_expected_radius: 0.015   # smaller than the smallest potato you'd ever load
    max_expected_radius: 0.07    # larger than the largest potato you'd ever load
    radius_band: 0.02
    # The potato is mounted on a pin, so its centre HEIGHT changes with
    # potato size even though the fixture repeats laterally. With auto on,
    # potato_center above is a starting guess and a safety bound: the real
    # centre is re-fitted from the accumulated cloud, and any fit further
    # than potato_center_max_shift from the configured value is rejected
    # as having latched onto the fixture or background.
    potato_center_auto: true
    potato_center_max_shift: 0.03
    potato_center_min_points: 800
    # Which depth camera is fitted. Checked at startup against the distance
    # the scan actually uses, which is NOT scan_radius: the camera images the
    # potato's SURFACE, a potato-radius nearer than its centre. At 0.15 m
    # around the largest potato this fixture admits (max_expected_radius
    # 0.07) the nearest surface sits 8 cm from the lens -- inside a D405's
    # range, well inside a D435's minimum of ~16.8 cm, and far inside a
    # D455's 0.40 m. Leave empty if unknown; that is reported, not assumed
    # safe. Known names: d405, d435, d435i, d415, d455, gemini335.
    camera_model: ""
    scan_radius: 0.15
    # PHASE A -- the fixed raster orbit every potato gets before any
    # gap-filling: face the potato, sweep the camera up/down one vertical
    # column, rotate azimuth_step_deg, sweep the next column, repeat.
    # 45deg azimuth x 25deg elevation over the -15..85deg band = 8 columns
    # x 5 rows = 40 views, leaving 20 of max_views for phase B.
    raster_orbit: true
    azimuth_step_deg: 45.0
    elevation_step_deg: 25.0
    # Live coverage grid resolution (degrees per cell) around the potato.
    # Coverage is judged from real accumulated points landing in each
    # cell (surface_coverage.SurfaceCoverageGrid), not from a preset
    # candidate list -- this is what lets differently-shaped potatoes
    # each get scanned according to their own actual gaps.
    elevation_bin_deg: 8.0
    azimuth_bin_deg: 8.0
    min_hits_to_fill: 3
    min_elevation_deg: -15.0
    max_elevation_deg: 85.0
    coverage_threshold: 0.95
    max_views: 60
    settle_time_s: 1.5
    # When a targeted grid cell is still empty after its nominal view,
    # retry that exact spot this many times with an independent recovery
    # motion (closer/farther radius, tilted angle -- see
    # surface_coverage.RECOVERY_OFFSETS) before giving up and flagging it
    # unscannable. Capped at len(RECOVERY_OFFSETS)=6.
    max_local_retries: 4
    # Hand-eye calibration result: camera pose expressed in the TCP frame.
    # REPLACE these placeholders with your calibrateHandEye()/easy_handeye output.
    tcp_cam_translation: [0.0, -0.05, 0.05]
    tcp_cam_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    # 'heuristic' (default) or 'rl' -- see Step 4 below.
    view_policy: "heuristic"
    rl_model_path: ""

pointcloud_accumulator:
  ros__parameters:
    camera_topic: "/camera/depth/color/points"
    base_frame: "base_link"
    voxel_size: 0.001
    # Fallback only -- updated live from scan_controller's own accepted fit
    # over /potato_scan/potato_center, same pattern eye_detector uses.
    potato_center: [0.50, 0.00, 0.15]
    # ROI crop radius, in base_frame, around potato_center. Added 2026-09-16:
    # with no crop at all, every frame's points -- table, fixture, the
    # ROBOT'S OWN BASE -- merged in permanently, which is how points on the
    # robot base ended up read as candidate eyes downstream (eye_detector's
    # own max_center_distance is a workaround for the symptom; this is the
    # point it should never have reached at all) and why a 4-view partial
    # scan already merged to 2.35M points with a bounding box spanning tens
    # of metres. Generous relative to eye_detector's own max_expected_radius
    # (0.07m): this crop has to keep the whole potato AND enough surrounding
    # context (fixture, pin) for scan_controller's own reachability/fixture
    # checks, not just eyes.
    roi_radius_m: 0.20
    # Statistical outlier removal, applied per incoming frame before the
    # merge. Stereo depth invents "flying pixels" along the potato's
    # silhouette; left in, they count as covered surface in
    # scan_controller's coverage grid (so the gap-filling phase never
    # revisits those directions) and corrupt the normals eye_detector
    # estimates at the rim. 0 neighbours disables the filter.
    # std_ratio chosen by sweep against a simulated silhouette-edge artefact
    # (6000 surface points + 110 flying pixels, scored on the real
    # SurfaceCoverageGrid): 1.0 removed all 110 but cost 35 real points and
    # 3 genuinely-scanned cells; 1.5 removed all 110 for 4 real points and
    # no lost cells; 2.5 started leaving flying pixels behind.
    outlier_neighbors: 50
    outlier_std_ratio: 1.5

eye_detector:
  ros__parameters:
    base_frame: "base_link"
    # Fallback only -- scan_controller publishes the centre it settled on over
    # /potato_scan/potato_center, and normals are oriented outward from it.
    potato_center: [0.50, 0.00, 0.15]
    knn: 30
    # "How curved": mean curvature H = (k1 + k2) / 2 of a quadratic patch
    # fitted to each neighbourhood, in 1/m -- the surface's physical
    # curvature, positive inward. 150 means "bends tighter than a 6.7 mm
    # sphere". Set from what an eye is, not from how the scan was taken: it
    # does not move with point density, and on the simulated potato an eye
    # reads 130-300/m against a body 99th percentile of 18-68/m. Chosen over
    # 30 potatoes and five noise levels (see surface_curvature.py): 100
    # finds more eyes but admits noise past 0.2 mm, 200 misses shallow ones.
    # Check against the H percentiles eye_detector logs on a real scan.
    mean_curvature_min: 150.0
    # The gate this node used until 2026-09-16: surface variation kappa =
    # lambda0 / sum(lambda), dimensionless. Negative = off (the default).
    # Replaced because it is not scale-invariant AND it rises with the noise
    # floor -- on the simulated potato a nominal eye sat at 0.010-0.016
    # against this 0.015, and 0.25 mm of noise pushed the whole surface
    # over it. Still logged every run, since its percentiles are how a
    # scan's density and noise get read. Set to 0.015 to get the old gate
    # back; both gates apply if both are on.
    curvature_min: -1.0
    # "Which way curved": Chen & Bhanu's shape index, 0 = cup (an eye),
    # 0.5 = saddle, 0.75 = ridge, 1.0 = dome (the potato's own body). Scale-
    # invariant, so unlike curvature_min this should not need tuning. Curvature
    # alone cannot tell a pit from the ridge beside it; this is what does.
    shape_index_max: 0.35
    # How much darker than the surrounding skin a candidate must be, as a
    # fraction of the surround's brightness. Curvature and shape index
    # describe a pit, and a clod of soil in a hollow is also a pit -- colour
    # is the only axis that separates them, and the camera is already
    # publishing it. Negative measures and logs the contrast without
    # rejecting anything, which is the default until the number has been
    # seen on real potatoes. On a synthetic where clods share the eyes'
    # geometry exactly, eyes came out near +0.55 and clods near +0.02.
    min_color_contrast: -1.0
    # Directional agreement among a cluster's member normals, 0..1.
    # Negative = measure and log it, reject nothing. Left off on purpose:
    # no threshold is earned yet (on synthetic clouds this does NOT predict
    # normal error -- see surface_curvature.find_eye_candidates). Read it in
    # the eye_detector log next to drill_controller's normal_vs_radial_deg
    # from one real run, then set it from those pairs.
    min_normal_consistency: -1.0
    cluster_eps: 0.003
    cluster_min_points: 8
    min_eye_diameter: 0.002
    max_eye_diameter: 0.015
    # Same value and meaning as scan_controller's max_expected_radius:
    # "larger than the largest potato you'd ever load". potato_center above
    # only orients normals, it does not restrict which points get
    # considered -- CONFIRMED 2026-09-14 that matters against a real cloud,
    # not just a synthetic one: without this, points on the robot's own
    # base satisfied the same curvature+shape-index window and were
    # reported as eyes tens of cm from the potato.
    max_expected_radius: 0.07

drill_controller:
  ros__parameters:
    robot_ip: "192.168.1.100"
    robot_backend: "rtde"     # 'rtde' or 'isaac_sim' -- see scan_controller above
    base_frame: "base_link"
    tcp_frame: "tool0"        # only used by isaac_sim backend
    drill_output_pin: 0       # UR5e tool digital output driving the drill relay
    standoff: 0.03            # approach distance above the eye, meters
    # SAFETY LIMIT -- penetration measured from the DETECTED CONTACT POINT,
    # not from the standoff approach pose (see robot_interface.force_drill).
    # 8mm is grounded in the literature for potato eye tissue: Divyanth et
    # al. 2025 punch to an intended 7.00mm with a 3.25mm blade and recover
    # cores of 2.81-6.92mm (mean 5.84mm). The previous 0.015 was both
    # deeper than anything that work needed AND smaller than `standoff`,
    # which under the old from-the-approach-pose measurement meant the bit
    # stopped 15mm short of the potato and reported success.
    max_depth: 0.008
    # Newtons of force-mode feed pressure into the surface. Published
    # penetration tests put the peak force to puncture raw potato flesh
    # through the skin at 41-47 N with a 2 mm probe (cv. Spunta), and eyes
    # sit in the perimedullary zone, which is the LEAST resistant of the
    # tuber's tissues -- so a feed well under the whole-skin puncture peak
    # is the right magnitude for advancing through an eye.
    feed_force: 15.0
    # SAFETY LIMIT -- abort insertion above this force. 40 N is supported for
    # softer cultivars but sits right at their puncture peak, so it can trip
    # early on dense ones: a needle probe on cv. Kufri Badshah peaked at
    # 79 N. Raise toward 60-90 N for those, and treat this as a per-cultivar
    # setting rather than a constant.
    max_force: 40.0
    # Force at which the bit counts as having touched the potato; this is
    # what defines depth zero for max_depth. Keep above the free-space noise
    # floor and well below max_force. 5 N is conservative by an order of
    # magnitude against the 41-47 N it takes to actually puncture, and
    # comfortably above the 0.2-2.5 N trigger forces texture analysers use
    # to detect first contact with produce.
    contact_force: 5.0
    # How far the real surface may sit from where eye detection put it.
    # After feeding standoff + this much with no contact, the insertion
    # aborts as 'no_contact' (bad eye pose / potato moved) instead of
    # pushing into empty space.
    surface_position_tolerance: 0.02
    # Fixture keep-out. The potato is impaled on a pin, so a cone opening
    # from its centre toward the fixture is solid hardware that the
    # reachability search cannot see (driving into a pin is perfectly
    # reachable). fixture_axis points from the potato centre toward the
    # fixture: [0, 0, -1] for a potato on top of a vertical pin.
    # potato_center here is a fallback only -- scan_controller publishes
    # the centre it settled on over /potato_scan/potato_center.
    potato_center: [0.50, 0.00, 0.15]
    fixture_axis: [0.0, 0.0, -1.0]
    fixture_keepout_half_angle_deg: 35.0
    # Shape of the cut. The plunge always bores to max_depth; this is the
    # pass that follows, spiralling outward as it rises so the hole opens
    # into a cone, and ending at the surface so it doubles as the retraction.
    # 0.0 = straight pull-out, i.e. exactly the bore the plunge made and the
    # only behaviour validated so far. Raising it is what turns "drill a
    # hole" into "scoop the eye out", and it is the knob a learned policy
    # would set per eye rather than a choice that has to be made up front.
    cut_lateral_radius: 0.0
    cut_turns: 2.0
    # Task tolerance on the insertion axis -- how far off the surface
    # normal the drill may be aimed when no reachable pose exists straight
    # down it. Tried smallest-first, so a tilt is only used as a fallback.
    max_approach_tilt_deg: 15.0
    approach_tilt_step_deg: 7.5
    approach_speed: 0.2
    approach_acceleration: 0.5
    drill_timeout_s: 8.0
    # 'heuristic' (default) or 'rl' -- see Step 4 below.
    approach_policy: "heuristic"
    rl_model_path: ""

# Step 3 (run before trusting drill_controller): ros2 run potato_scan
# force_drill_tuner. Freedrive to a single real probe point and iterate
# on feed_force/max_force/max_depth here in isolation -- start low, watch
# the reported depth/force, then raise. Copy tuned values into
# drill_controller above once confident.
force_drill_tuner:
  ros__parameters:
    robot_ip: "192.168.1.100"
    drill_output_pin: 0
    feed_force: 8.0     # start LOW, well under drill_controller's value above
    max_force: 25.0
    max_depth: 0.008    # penetration past contact -- see drill_controller above
    contact_force: 5.0
    standoff: 0.03      # only used to bound the no-contact approach travel
    surface_position_tolerance: 0.02
    drill_timeout_s: 8.0

# Step 4 (optional, needs Isaac Sim): train RL policies that replace the
# next-gap-cell scan heuristic and the roll-search drill-approach heuristic
# with a learned policy. Training runs inside Isaac Sim's own physics (real
# robot moves, real contact force), so it's slow -- a solid first draft to
# iterate on, not a guaranteed-converged recipe. See
# src/potato_scan/potato_scan/rl/ for the shared observation/action/reward
# code and src/potato_scan/isaac/train_scan_policy.py /
# train_drill_policy.py for the training scripts themselves.
#
#   1. colcon build --symlink-install && source install/setup.bash
#   2. <isaac-sim-install-dir>/python.sh -m pip install stable-baselines3 gymnasium
#   3. <isaac-sim-install-dir>/python.sh src/potato_scan/isaac/train_scan_policy.py
#      <isaac-sim-install-dir>/python.sh src/potato_scan/isaac/train_drill_policy.py
#   4. set scan_controller.view_policy / drill_controller.approach_policy to
#      "rl" above, and rl_model_path to the saved model (e.g.
#      models/scan_policy_final.zip), then launch with
#      robot_backend:=isaac_sim as usual.
